apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.matisu.auto'
    compileSdk 34

    defaultConfig {
        applicationId "com.matisu.auto"
        minSdk 24          // dispatchGesture 需 API 24+
        targetSdk 34
        versionCode 2
        versionName "0.2"
    }

    // 固定签名（仓库内 keystore）——CI 每次 runner 是全新环境，默认 debug
    // keystore 随机生成导致相邻两次 CI 产物签名互斥，install -r 无法覆盖升级。
    signingConfigs {
        debug {
            storeFile file('matisu-debug.keystore')
            storePassword 'matisu123'
            keyAlias 'matisu'
            keyPassword 'matisu123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // Lua 引擎：luaj 是纯 Java 的 Lua 5.2/5.3 实现，无需 NDK，Phase 0 直接可用。
    // 如需原生性能，可后续替换为 LuaJIT/AndroLua（需 NDK 交叉编译 .so）。
    implementation 'org.luaj:luaj-jse:3.0.1'
    // OCR：onnxruntime-android（与 iOS 同版本 1.17.x，同一套 PP-OCRv6 模型 ir_version=9）
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
}
