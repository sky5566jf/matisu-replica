name: iOS Theos Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build Tweak (rootless deb)
        working-directory: ios/tweak
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Build App + package tipa (TrollStore)
        working-directory: ios/app
        run: |
          make clean
          make package FINALPACKAGE=1
          APP=$(find .theos/obj -name 'MatisuAuto.app' -maxdepth 3 -type d | head -1)
          echo "APP=$APP"
          [ -z "$APP" ] && { echo "!! app not found"; exit 1; }
          rm -rf /tmp/tipa && mkdir -p /tmp/tipa/Payload
          cp -r "$APP" /tmp/tipa/Payload/
          cd /tmp/tipa && zip -r "$GITHUB_WORKSPACE/matisu-auto.tipa" Payload
          echo "tipa size: $(stat -f%z $GITHUB_WORKSPACE/matisu-auto.tipa 2>/dev/null || wc -c < $GITHUB_WORKSPACE/matisu-auto.tipa) bytes"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matisu-auto-ios
          path: |
            ios/tweak/packages/*.deb
            matisu-auto.tipa
          if-no-files-found: warn
