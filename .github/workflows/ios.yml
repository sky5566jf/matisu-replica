name: iOS Theos Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build Tweak (rootless deb)
        working-directory: ios/tweak
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      # ============ OCR 依赖：onnxruntime iOS 静态库 + PP-OCRv6 模型 ============
      - name: Fetch onnxruntime iOS static lib
        run: |
          mkdir -p ios/ort
          curl -sL "https://github.com/csukuangfj/onnxruntime-libs/releases/download/v1.17.1/onnxruntime.xcframework-1.17.1.tar.bz2" -o /tmp/ort.tar.bz2
          tar xjf /tmp/ort.tar.bz2 -C ios/ort
          ls ios/ort/onnxruntime.xcframework/ios-arm64/

      - name: Fetch PP-OCRv6 models (onnx)
        run: |
          ls -la ios/ocr/onnx/ 2>/dev/null || { echo "!! ios/ocr/onnx 模型未提交到仓库"; exit 1; }

      # ============ 引擎模式 1/3：免越狱巨魔引擎（TrollStore tipa） ============
      - name: Build App + package tipa (TrollStore)
        working-directory: ios/app
        run: |
          make clean
          make FINALPACKAGE=1 ARCHS=arm64
          BIN=$(find .theos/obj/MatisuAuto.app -name MatisuAuto -type f 2>/dev/null | head -1)
          [ -z "$BIN" ] && { echo "!! binary not built"; exit 1; }
          rm -rf /tmp/tipa
          mkdir -p /tmp/tipa/Payload/MatisuAuto.app/ocr
          cp "$BIN" /tmp/tipa/Payload/MatisuAuto.app/MatisuAuto
          cp Info.plist Entitlements.plist /tmp/tipa/Payload/MatisuAuto.app/
          cp AppIcon60x60@2x.png AppIcon60x60@3x.png /tmp/tipa/Payload/MatisuAuto.app/ 2>/dev/null || true
          cp ../ocr/onnx/det.onnx ../ocr/onnx/rec.onnx ../ocr/onnx/dict.txt /tmp/tipa/Payload/MatisuAuto.app/ocr/
          LDID="$THEOS/bin/ldid"; [ -x "$LDID" ] || LDID=$(command -v ldid || true)
          if [ -n "$LDID" ]; then
            "$LDID" -SEntitlements.plist /tmp/tipa/Payload/MatisuAuto.app/MatisuAuto && echo "signed with ldid"
          else
            echo "!! ldid not found; TrollStore will re-sign on install"
          fi
          echo "== tipa app contents =="
          ls -la /tmp/tipa/Payload/MatisuAuto.app /tmp/tipa/Payload/MatisuAuto.app/ocr
          cd /tmp/tipa && zip -r "$GITHUB_WORKSPACE/matisu-auto.tipa" Payload
          echo "tipa size: $(wc -c < $GITHUB_WORKSPACE/matisu-auto.tipa) bytes"

      # ============ 引擎模式 2/3：有线越狱（rootful deb） ============
      - name: Build App deb (rootful)
        working-directory: ios/app
        run: |
          chmod +x package_deb.sh
          ./package_deb.sh rootful arm64 matisu-auto_rootful.deb

      # ============ 引擎模式 3/3：无线越狱 arm64（rootless deb） ============
      - name: Build App deb (rootless arm64)
        working-directory: ios/app
        run: ./package_deb.sh rootless arm64 matisu-auto_rootless_arm64.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matisu-auto-ios
          path: |
            ios/dist/*.deb
            ios/app/packages/*.deb
            ios/tweak/packages/*.deb
            matisu-auto.tipa
          if-no-files-found: warn
